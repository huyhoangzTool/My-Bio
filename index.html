<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <title>PNguyen Huy Hoang</title>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lock">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-fb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M16.67 15.47 17.2 12h-3.33V9.75c0-.95.47-1.88 1.96-1.88h1.51V4.92s-1.37-.23-2.69-.23c-2.74 0-4.53 1.66-4.53 4.67V12H7.08v3.47h3.05V24h3.75v-8.53z"/></symbol>
    <symbol id="i-zalo" viewBox="0 0 24 24"><path fill="#0068FF" d="M7 1h10a6 6 0 0 1 6 6v7a6 6 0 0 1-6 6H8.5L3 23.5l1.3-4.4A6 6 0 0 1 1 14V7a6 6 0 0 1 6-6z"/><text x="12" y="13.8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="8.4" letter-spacing="-.2" fill="#fff">Zalo</text></symbol>
    <symbol id="i-dc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#5865F2"/><path fill="#fff" transform="translate(4.8 4.8) scale(.6)" d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></symbol>
    <symbol id="i-sakura" viewBox="0 0 11 11"><g shape-rendering="crispEdges"><path fill="#FFC4D8" d="M4 0h1v1H4zM6 0h1v1H6zM3 1h5v2H3zM1 3h2v1H1zM4 3h3v1H4zM8 3h2v1H8zM1 4h9v2H1zM2 6h7v1H2zM2 7h3v2H2zM6 7h3v2H6zM3 9h1v1H3zM7 9h1v1H7z"/><path fill="#FF8FB4" d="M4 4h3v3H4z"/><path fill="#FFF0F6" d="M4 1h1v1H4zM2 4h1v1H2zM7 7h1v1H7z"/><path fill="#FFD45E" d="M5 5h1v1H5z"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 9 9"><g shape-rendering="crispEdges"><path fill="#3b0b12" d="M1 0h3v1H1zM5 0h3v1H5zM0 1h1v4H0zM8 1h1v4H8zM4 1h1v1H4zM1 5h1v1H1zM7 5h1v1H7zM2 6h1v1H2zM6 6h1v1H6zM3 7h1v1H3zM5 7h1v1H5zM4 8h1v1H4z"/><path fill="#ff3b4e" d="M1 1h3v1H1zM5 1h3v1H5zM1 2h7v1H1zM1 3h7v2H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z"/><path fill="#ffd0d6" d="M2 1h1v1H2zM1 2h1v1H1z"/><path fill="#b0182c" d="M7 3h1v2H7zM6 5h1v1H6zM5 6h1v1H5z"/></g></symbol>
  </svg>

  <div class="hero-bg" aria-hidden="true"><div class="glow" id="glow"></div></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="wrap">
    <div class="banner reveal">
      <img class="cover" src="image/banner.jpeg" alt="Ảnh bìa" decoding="async">
      <img class="frame" src="image/vienbanner.gif" alt="">
    </div>
    <div class="avatar reveal" style="--d:.1s">
      <img class="pic" src="image/avatar.jpeg" alt="Ảnh đại diện PNguyen Huy Hoang" decoding="async">
      <img class="ring" src="image/vien.gif" alt="">
    </div>

    <h1 class="name reveal" style="--d:.15s"><span>PNguyen Huy Hoang</span><img src="image/tichxanh.gif" alt="Đã xác minh"></h1>

    <nav class="socials reveal" style="--d:.22s" aria-label="Mạng xã hội">
      <a data-link="fb" aria-label="Facebook"><svg class="ic"><use href="#i-fb"/></svg></a>
      <a data-link="zalo" aria-label="Zalo"><svg class="ic"><use href="#i-zalo"/></svg></a>
      <a data-link="discord" aria-label="Discord"><svg class="ic"><use href="#i-dc"/></svg></a>
    </nav>

    <div class="player glass reveal">
      <div class="disc"><img src="image/dianhac.png" alt="Đĩa nhạc"></div>
      <input class="seek" type="range" min="0" max="1000" value="0" aria-label="Tua nhạc">
      <button class="play" type="button" aria-label="Phát / dừng">
        <svg class="pl" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="pa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/></svg>
      </button>
      <audio id="audio" src="audio/exhateme.mp3" preload="metadata" loop></audio>
    </div>

    <p class="bio reveal">I’m a <span class="vn">Vietnam</span> people. I love vibe code, listen music and sleep.</p>

    <section class="actions">
      <div class="reveal"><button class="action glass" type="button" data-open-modal><img src="image/ctr.png" alt=""><i></i><span>Cải thiện Rank, Top Tướng</span></button></div>
      <div class="reveal" style="--d:.1s"><button class="action glass" type="button" data-open-modal><img src="image/cs.png" alt=""><i></i><span>Chung sức LQ siêu tốc <b class="price">35k</b></span></button></div>
      <div class="reveal" style="--d:.2s"><button class="action glass" type="button" data-open-modal><img src="image/hcj.png" alt=""><i></i><span>Làm website Profile, Custom Hook,…</span></button></div>
    </section>
  </main>

  <footer>
    <p class="reveal"><em>© PNguyen Huy Hoang</em></p>
    <p class="reveal" style="--d:.12s">Source code by HuyHoang/Open Source Repo in Github/wuyhoanqz</p>
  </footer>

  <div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="sheet">
      <button class="close" type="button" aria-label="Đóng">✕</button>
      <h2 id="modal-title">Bạn muốn Cải thiện Rank, Top tướng hoặc cày chung sức siêu tốc? Liên hệ với chúng tôi ngay:</h2>
      <div class="row">
        <a data-link="fb" aria-label="Facebook"><svg class="ic"><use href="#i-fb"/></svg></a>
        <a data-link="zalo" aria-label="Zalo"><svg class="ic"><use href="#i-zalo"/></svg></a>
        <a data-link="discord" aria-label="Discord"><svg class="ic"><use href="#i-dc"/></svg></a>
      </div>
    </div>
  </div>

  <div class="splash" id="splash" role="status">
    <p>Xin chờ chút<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
    <div class="hearts"><svg viewBox="0 0 9 9"><use href="#i-heart"/></svg><svg viewBox="0 0 9 9"><use href="#i-heart"/></svg><svg viewBox="0 0 9 9"><use href="#i-heart"/></svg></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
