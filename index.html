<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PNguyen Huy Hoang</title>
<script>document.documentElement.classList.add('js')</script>
<style>
/* ===== Biến chung ===== */
:root{
  --ease:cubic-bezier(.32,.72,0,1);          /* đường cong mềm kiểu iOS, dùng cho mọi chuyển động */
  --gold:255,190,40;
  --av:clamp(132px,38vw,184px);              /* đường kính avatar */
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:#000;-webkit-text-size-adjust:100%}
body{min-height:100svh;color:#fff;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ===== Hào quang vàng (tự code, không dùng ảnh) ===== */
.hero-bg{position:absolute;inset:0 0 auto;height:640px;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000 58%,transparent);mask-image:linear-gradient(#000 58%,transparent)}
.glow{position:absolute;left:50%;top:300px;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;
  background:
    radial-gradient(closest-side at 24% 28%,rgba(var(--gold),.7),transparent 72%),
    radial-gradient(closest-side at 78% 74%,rgba(255,140,0,.45),transparent 70%),
    radial-gradient(closest-side at 50% 50%,rgba(255,205,70,.16),transparent 80%);
  filter:blur(26px);will-change:transform}

/* ===== Hiệu ứng xuất hiện khi cuộn ===== */
.js .reveal{opacity:0;transform:translateY(32px) scale(.98);filter:blur(8px);
  transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease);transition-delay:var(--d,0s)}
.js .reveal.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.js .reveal{opacity:1;transform:none;filter:none;transition:none}}

/* ===== Hồ sơ ===== */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.banner{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.avatar{position:relative;width:var(--av);height:var(--av);margin:calc(var(--av) / -2) auto 0}
.avatar .pic{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff}
/* vien.gif: đè lên avatar, căn giữa. Chỉnh top/width nếu muốn vòng viền khác */
.avatar .ring{position:absolute;left:50%;top:-10%;width:58%;transform:translateX(-50%);pointer-events:none}
.name{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:6px;text-align:center;
  font-size:clamp(1.7rem,8vw,2.1rem);font-weight:800;letter-spacing:-.02em}
.name img{width:1.05em;height:1.05em}

/* ===== Nút mạng xã hội ===== */
.socials{display:flex;width:max-content;margin:14px auto 0;gap:22px;padding:8px 18px;border-radius:999px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.5)}
.socials a{position:relative;display:block}
.socials a+a::before{content:"";position:absolute;left:-12px;top:22%;height:56%;width:1px;background:rgba(255,255,255,.28)}
.ic{width:42px;height:42px;display:block;transition:transform .5s var(--ease)}
a:active .ic{transform:scale(.92)}
@media (hover:hover){a:hover .ic{transform:translateY(-2px) scale(1.08)}}

/* ===== Bio ===== */
.bio{padding:12vh 6px 6vh;color:#fff;font-size:clamp(1.7rem,7.4vw,2.2rem);line-height:1.85;
  font-family:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif}
.vn{display:inline-block;padding-right:.1em;font-style:italic;font-weight:800;
  background:linear-gradient(100deg,#ff1f1f 0%,#da251d 35%,#ffcd00 75%,#ffe34d 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,170,0,.35))}

/* ===== Nút hành động: Glassmorphism ===== */
.actions{display:grid;gap:18px;padding:0 4px}
.action{position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:12px 24px 12px 16px;
  border:1px solid rgba(255,255,255,.38);border-radius:999px;color:#fff;cursor:pointer;overflow:hidden;
  font:700 clamp(1.05rem,4.8vw,1.3rem)/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.45);
  background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(15px) saturate(170%);backdrop-filter:blur(15px) saturate(170%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -12px 24px rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.5);
  transition:transform .55s var(--ease),background .55s var(--ease)}
.action::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.3),transparent 42%)}
.action:active{transform:scale(.965)}
@media (hover:hover){.action:hover{transform:translateY(-3px) scale(1.015);background:rgba(255,255,255,.16)}}
.action .dog{width:64px;height:48px;flex:none}
.action i{width:1px;align-self:stretch;margin:6px 0;background:rgba(255,255,255,.35)}
.action span{flex:1}

/* ===== Footer ===== */
footer{position:relative;z-index:1;text-align:center;padding:14vh 20px calc(40px + env(safe-area-inset-bottom));
  color:rgba(255,255,255,.72);font-size:.95rem;line-height:1.9}
footer em{color:#fff}

/* ===== Popup ===== */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.sheet{position:relative;width:min(100%,380px);padding:36px 22px 28px;text-align:center;border-radius:30px;
  background:rgba(255,250,238,.9);border:1px solid rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(var(--gold),.25);
  transform:translateY(28px) scale(.9);opacity:0;transition:transform .65s var(--ease),opacity .45s var(--ease)}
.overlay.open .sheet{transform:none;opacity:1}
.sheet h2{font:800 clamp(1.15rem,5.2vw,1.4rem)/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:#2a1c00;background:linear-gradient(115deg,#9c6800 0%,#d29a0a 24%,#8a5d00 46%,#2a1c00 74%,#000 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sheet .row{display:flex;justify-content:center;gap:22px;margin-top:24px}
.sheet .ic{width:58px;height:58px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
.close{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(0,0,0,.08);color:#2a1c00;font-size:16px;line-height:1;transition:transform .45s var(--ease)}
.close:active{transform:scale(.88)}
/* ===== Hoa anh đào rơi (nền) ===== */
.petals{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.petal{position:absolute;top:-40px;animation:fall linear infinite,sway ease-in-out infinite alternate}
.petal svg{display:block;width:100%;height:100%;animation:spin linear infinite}
@keyframes fall{to{transform:translateY(calc(100vh + 80px))}}
@keyframes sway{from{translate:-28px 0}to{translate:28px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.petals{display:none}}
:focus-visible{outline:2px solid rgba(var(--gold),.9);outline-offset:3px}
</style>
</head>

<!-- Hào quang vàng phía sau ảnh bìa + avatar (JS xoay phần tử #glow) -->
<div class="hero-bg" aria-hidden="true"><div class="glow" id="glow"></div></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<main class="wrap">
  <!-- Component: Ảnh bìa + avatar -->
  <img class="banner reveal" src="image/banner.jpeg" alt="Ảnh bìa" decoding="async">
  <div class="avatar reveal" style="--d:.1s">
    <img class="pic" src="image/avatar.jpeg" alt="Ảnh đại diện PNguyen Huy Hoang" decoding="async">
    <img class="ring" src="image/vien.gif" alt="">
  </div>

  <!-- Component: Tên + tích xanh -->
  <h1 class="name reveal" style="--d:.15s">PNguyen Huy Hoang<img src="image/tichxanh.gif" alt="Đã xác minh"></h1>

  <!-- Component: Mạng xã hội (href được gán trong JS, xem biến LINKS) -->
  <nav class="socials reveal" style="--d:.22s" aria-label="Mạng xã hội">
    <a data-link="fb" aria-label="Facebook"><svg class="ic"><use href="#i-fb"/></svg></a>
    <a data-link="zalo" aria-label="Zalo"><svg class="ic"><use href="#i-zalo"/></svg></a>
    <a data-link="discord" aria-label="Discord"><svg class="ic"><use href="#i-dc"/></svg></a>
  </nav>

  <!-- Component: Bio -->
  <p class="bio reveal">I’m a <span class="vn">Vietnam</span> people. I love vibe code, listen music and sleep.</p>

  <!-- Component: Nút hành động (mở popup) -->
  <section class="actions">
    <div class="reveal">
      <button class="action" type="button" data-open-modal><svg class="dog" aria-hidden="true"><use href="#i-dog"/></svg><i></i><span>Cải thiện Rank, Top Tướng</span></button>
    </div>
    <div class="reveal" style="--d:.12s">
      <button class="action" type="button" data-open-modal><svg class="dog" aria-hidden="true"><use href="#i-dog"/></svg><i></i><span>Chung sức siêu tốc</span></button>
    </div>
  </section>

<!-- Component: Popup liên hệ -->
<div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
  <div class="sheet">
    <button class="close" type="button" aria-label="Đóng">✕</button>
    <h2 id="modal-title">Bạn muốn Cải thiện Rank, Top tướng hoặc cày chung sức siêu tốc? Liên hệ với chúng tôi ngay:</h2>

    </div>
  </div>
</div>

<script>
/* ===== 0. Link mạng xã hội — chỉ cần sửa ở đây ===== */
const LINKS = {
  fb: 'LINK-FACEBOOK-TAI-DAY',               // <- thay bằng link Facebook của bạn
  zalo: 'https://zalo.me/0366474283',
  discord: 'https://discord.gg/5N77ej5v'
};
document.querySelectorAll('[data-link]').forEach(a => {
  a.href = LINKS[a.dataset.link];
  a.target = '_blank';
  a.rel = 'noopener';
});

/* ===== 1. HÀO QUANG XOAY THEO SCROLL =====
   Góc xoay = window.scrollY * SPEED (tỷ lệ thuận với quãng cuộn).
   CSS rotate dương = thuận chiều kim đồng hồ:
   - lướt xuống: scrollY tăng  -> góc tăng  -> xoay thuận chiều kim đồng hồ
   - lướt lên:   scrollY giảm  -> góc giảm  -> xoay ngược chiều kim đồng hồ
   Dùng nội suy (lerp) để chuyển động có quán tính mượt như iOS. */
const glow = document.getElementById('glow');
const SPEED = 0.25;                           // độ xoay trên mỗi px cuộn (cuộn 400px -> xoay 100°)
let targetAngle = 0, currentAngle = 0, rafId = 0;

function animateGlow() {
  currentAngle += (targetAngle - currentAngle) * 0.12;
  glow.style.transform = `rotate(${currentAngle}deg)`;
  // dừng vòng lặp khi đã tới gần góc đích để đỡ tốn pin
  rafId = Math.abs(targetAngle - currentAngle) > 0.01 ? requestAnimationFrame(animateGlow) : 0;
}
function onScroll() {
  targetAngle = window.scrollY * SPEED;
  if (!rafId) rafId = requestAnimationFrame(animateGlow);
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ===== 2. HIỆN DẦN KHI CUỘN TỚI =====
   Hiện đúng 1 lần rồi giữ nguyên (unobserve ≈ { once: true }). */
const revealItems = document.querySelectorAll('.reveal');
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('in');
      io.unobserve(entry.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  revealItems.forEach(el => io.observe(el));
} else {
  revealItems.forEach(el => el.classList.add('in'));
}

/* ===== 3. BẬT / TẮT POPUP =====
   Mở: bấm 1 trong 2 nút hành động (có thuộc tính data-open-modal).
   Đóng: bấm nút ✕, bấm ra vùng mờ bên ngoài, hoặc nhấn phím Esc. */
const modal = document.getElementById('modal');
let lastFocus = null;

function openModal() {
  lastFocus = document.activeElement;
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lock');        // khóa cuộn nền khi popup đang mở
  modal.querySelector('.close').focus({ preventScroll: true });
}
function closeModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lock');
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
document.querySelectorAll('[data-open-modal]').forEach(btn => btn.addEventListener('click', openModal));
modal.addEventListener('click', e => {
  if (e.target === modal || e.target.closest('.close')) closeModal();
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
});

/* ===== 4. HOA ANH ĐÀO RƠI =====
   Tạo các cánh hoa pixel (symbol #i-sakura) với kích thước, tốc độ, độ lắc ngẫu nhiên.
   Chỉnh số lượng ở biến COUNT. */
const petalLayer = document.getElementById('petals');
const COUNT = matchMedia('(max-width:600px)').matches ? 12 : 22;
for (let i = 0; i < COUNT; i++) {
  const size = 12 + Math.random() * 16;
  const el = document.createElement('span');
  el.className = 'petal';
  el.style.cssText =
    `left:${Math.random() * 100}%;width:${size}px;height:${size}px;opacity:${(.45 + Math.random() * .5).toFixed(2)};` +
    `animation-duration:${(9 + Math.random() * 10).toFixed(1)}s,${(3 + Math.random() * 3).toFixed(1)}s;` +
    `animation-delay:${(-Math.random() * 18).toFixed(1)}s,${(-Math.random() * 5).toFixed(1)}s`;
  el.innerHTML = `<svg viewBox="0 0 11 11" style="animation-duration:${(6 + Math.random() * 8).toFixed(1)}s"><use href="#i-sakura"/></svg>`;
  petalLayer.appendChild(el);
}
</script>
</body>
